
name: Build Etiqueta Scanner APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./QMR1300_Offline_NYX-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/cmdline-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Project
        run: |
          echo "Project files:"
          ls -la
          echo "Gradle files:"
          find . -maxdepth 2 -name "*.gradle*"

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Etiqueta-Scanner-V1
          path: QMR1300_Offline_NYX-main/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
